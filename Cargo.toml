[workspace]
resolver = "2"
members = [
    "crates/kvm-protocol",
    "crates/kvm-server",
    "crates/kvm-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
